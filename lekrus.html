<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c99a2e" />
<title>Mom's Two Lekrus · Rakshit &amp; Ashrit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="lekrus">
<canvas id="confetti"></canvas>
<main class="wrap">
  <section class="page">
    <div class="center">
      <p class="eyebrow reveal" data-cfg="labels.lekrus.eyebrow">Rakshit &amp; Ashrit</p>
      <h1 class="page-title reveal" data-cfg="labels.lekrus.title">Mom's Two Lekrus</h1>
      <div class="deco reveal"><span class="diamonds"><i></i><i></i><i></i></span><span class="dot"></span><span class="diamonds"><i></i><i></i><i></i></span></div>
      <p class="lead reveal" data-cfg="labels.lekrus.lead">Her two boys — equally loved, endlessly competitive.</p>
    </div>

    <!-- Cute photos together with Mom -->
    <h2 class="page-title reveal" style="font-size:var(--step-2);margin-top:2.4rem;">Us <em>with Mom</em></h2>
    <div class="deco reveal"><span class="dot"></span></div>
    <div class="gallery" data-gallery="lekrus"></div>

    <!-- Our wishes -->
    <h2 class="page-title reveal" style="font-size:var(--step-2);margin-top:3rem;">Our <em>wishes</em></h2>
    <div class="deco reveal"><span class="dot"></span></div>
    <div class="wishlist" data-wishes="lekruWishes"></div>

    <!-- The Best Lekru game -->
    <section id="lekru-game" class="game reveal" aria-label="Best Lekru game">
      <div class="center">
        <p class="eyebrow">Settle it once and for all</p>
        <h2 class="page-title" style="font-size:var(--step-2);">Who is the <em>Best Lekru?</em> 🏆</h2>
        <p class="game-hint">Cast your vote 👇</p>
      </div>
      <div class="game-mascot" id="game-mascot" aria-hidden="true">🙂</div>
      <div class="arena" id="arena">
        <button class="vote best" id="vote-best" type="button">Rakshit</button>
        <button class="vote other" id="vote-other" type="button">Ashrit</button>
      </div>
      <p class="game-result" id="game-result" role="status" aria-live="polite"></p>
    </section>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
