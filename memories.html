<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#c99a2e" />
<title>Yearbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="memories">
<canvas id="confetti"></canvas>
<main class="wrap">
  <section id="wall-section" class="page">
    <div class="center">
      <p class="eyebrow reveal">From everyone who loves her</p>
      <h1 class="page-title reveal">The <em>Yearbook</em></h1>
      <div class="deco reveal"><span class="diamonds"><i></i><i></i><i></i></span><span class="dot"></span><span class="diamonds"><i></i><i></i><i></i></span></div>
    </div>

    <!-- Locked until reveal date -->
    <div id="wall-locked" class="wall-lock reveal" hidden>
      <p class="lead" data-cfg="lockedNote" style="margin:0 auto .5rem;">The Memory Wall opens once the celebration begins.</p>
      <div class="countdown" id="countdown" aria-hidden="true"></div>
      <a class="btn gold" href="share.html">Add your memory now</a>
    </div>

    <!-- Revealed -->
    <div id="wall-open" hidden>
      <div class="wall" id="wall-grid"></div>
      <p class="empty-note" id="wall-status"></p>
    </div>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
